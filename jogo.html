<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Batalha">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0b1230">
<title>Batalha em Equipe · Guerras Espirituais</title>
<style>:root{--bg:#0b1230;--bg2:#141d4a;--card:#1b2760;--ink:#fff7e0;--mut:#b4bdea;--gold:#ffc83d;--ok:#38d08a;--bad:#ff5468;--blue:#39b6ff;--disp:"Bowlby One","Arial Black",Impact,sans-serif;--body:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% -10%,var(--bg2),var(--bg) 70%);color:var(--ink);font-family:var(--body);font-size:1rem;color-scheme:dark;overflow:hidden}
body::before,body::after{content:"";position:fixed;top:-15%;width:70%;height:120%;background:linear-gradient(180deg,rgba(255,215,120,.16),transparent 70%);clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);transform-origin:50% 0;pointer-events:none;z-index:0}
body::before{left:-20%;animation:b1 9s ease-in-out infinite alternate}
body::after{right:-20%;animation:b2 9s ease-in-out infinite alternate;animation-delay:-4s}
@keyframes b1{from{transform:rotate(-20deg)}to{transform:rotate(-6deg)}}
@keyframes b2{from{transform:rotate(20deg)}to{transform:rotate(6deg)}}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:.2rem solid var(--gold);outline-offset:.15rem}
.app{position:relative;z-index:1;max-width:32rem;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column}
.hud{flex:none;padding:.6rem .9rem .45rem;background:rgba(11,18,48,.88);border-bottom:.12rem solid rgba(255,200,61,.35)}
.hud1{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.nivel{font-family:var(--disp);color:var(--gold);font-size:.95rem;line-height:1.1}
.nivel small{display:block;font-family:var(--body);font-weight:700;color:var(--mut);font-size:.72rem;margin-top:.15rem}
.somb{min-width:2.9rem;min-height:2.9rem;border-radius:50%;background:#0f1842;border:.12rem solid #3a4890;font-size:1.25rem}
.inimigo{display:flex;align-items:center;gap:.7rem;margin:.2rem 0 .35rem}
.inimigo .ico{font-size:2rem;line-height:1}
.hp{flex:1;display:flex;gap:.3rem}
.hp i{flex:1;height:.9rem;border-radius:.3rem;background:var(--bad);box-shadow:0 0 .5rem rgba(255,84,104,.6);transition:transform .3s,opacity .3s}
.hp i.off{background:#2a335f;box-shadow:none;opacity:.7}
.hp i.hit{animation:hit .5s}
@keyframes hit{30%{transform:scaleY(1.8);background:#fff}}
.armadura{display:grid;grid-template-columns:repeat(6,1fr);gap:.25rem;text-align:center}
.pc{font-size:1.35rem;line-height:1.1;padding:.15rem 0;border-radius:.5rem;background:rgba(57,182,255,.16);border:.1rem solid rgba(57,182,255,.5)}
.pc small{display:block;font-size:.6rem;font-weight:800;color:var(--mut);line-height:1.1}
.pc.off{filter:grayscale(1);opacity:.35;background:transparent;border-color:#3a4890;text-decoration:line-through}
.pc.quebra{animation:quebra .8s}
@keyframes quebra{20%{transform:scale(1.4) rotate(-12deg)}60%{transform:scale(1.2) rotate(10deg)}}
.corpo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:.8rem .9rem;display:flex;flex-direction:column;gap:.7rem}
.corpo.c{justify-content:flex-start;text-align:center;align-items:center}.corpo.c>:first-child{margin-top:auto}.corpo.c>:last-child{margin-bottom:auto}
.barra{flex:none;padding:.7rem .9rem calc(.7rem + env(safe-area-inset-bottom));background:rgba(11,18,48,.92);display:flex;flex-direction:column;gap:.5rem}
.btn{min-height:3.3rem;width:100%;padding:.6rem 1rem;border-radius:.9rem;background:var(--gold);color:#241a00;font-weight:900;font-size:1.1rem;box-shadow:0 .2rem 0 #b88a00}
.btn:disabled{background:#4a5388;color:#b4bdea;box-shadow:none;cursor:not-allowed}
.btn.sec{background:#2b3a82;color:var(--ink);box-shadow:0 .2rem 0 #1b2760}
.selo{align-self:flex-start;background:var(--gold);color:#241a00;font-weight:900;font-size:.8rem;border-radius:99px;padding:.25rem .75rem}
.selo.final{background:var(--bad);color:#2b0007;margin-left:.4rem}
.linha{display:flex;flex-wrap:wrap;gap:.3rem}
.tempo{display:flex;align-items:center;gap:.6rem}
.barrat{flex:1;height:.7rem;border-radius:99px;background:#0f1842;overflow:hidden}
.barrat i{display:block;height:100%;width:100%;transform-origin:left;background:var(--ok);transition:background .3s}
.seg{font-family:var(--disp);font-size:1.4rem;min-width:3.2rem;text-align:center;border:.15rem solid var(--ok);border-radius:99px;padding:.05rem .5rem;font-variant-numeric:tabular-nums}
.seg.urge{border-color:var(--bad);color:var(--bad);animation:pisca .5s steps(1) infinite}
@keyframes pisca{50%{opacity:.35}}
.pergunta{margin:0;font-size:1.3rem;line-height:1.3;font-weight:800}
.opcoes{display:flex;flex-direction:column;gap:.55rem}
.opcao{display:flex;align-items:center;gap:.7rem;min-height:3.4rem;width:100%;text-align:left;padding:.65rem .8rem;border-radius:.9rem;background:var(--card);border:.15rem solid #3a4890;font-weight:700;font-size:1.02rem;line-height:1.25}
.opcao .l{flex:none;width:2rem;height:2rem;border-radius:50%;background:#0f1842;display:grid;place-items:center;font-family:var(--disp);font-size:.9rem;color:var(--gold)}
.opcao.sel{border-color:var(--gold);background:#2d3b86;box-shadow:0 0 0 .15rem var(--gold) inset}
.opcao.sel .l{background:var(--gold);color:#241a00}
.opcao.elim{opacity:.28;text-decoration:line-through;pointer-events:none}
.ajudas{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem}
.aj{min-height:3.1rem;border-radius:.8rem;background:#0f1842;border:.12rem solid #3a4890;font-weight:800;font-size:.78rem;line-height:1.15;padding:.3rem}
.aj b{display:block;font-size:1.15rem;font-weight:400}
.aj:disabled{opacity:.4}
.dica{background:#0f1842;border-left:.3rem solid var(--blue);border-radius:.6rem;padding:.6rem .8rem;font-size:.95rem;line-height:1.35}
.dica b{color:var(--blue)}
.dica .ap{font-family:var(--disp);font-size:1.5rem;color:var(--gold)}
.aviso{border-radius:.8rem;padding:.6rem .8rem;font-weight:900;font-size:1.1rem}
.aviso.ok{background:var(--ok);color:#052214}
.aviso.erro{background:var(--bad);color:#2b0007;animation:treme .5s}
@keyframes treme{20%{transform:translateX(-.5rem)}40%{transform:translateX(.5rem)}60%{transform:translateX(-.3rem)}80%{transform:translateX(.3rem)}}
.resp{background:var(--ok);color:#052214;border-radius:.8rem;padding:.6rem .8rem}
.resp span{display:block;font-size:.75rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.resp b{font-size:1.5rem;line-height:1.2;font-weight:900}
.expl{background:#0f1842;border-left:.3rem solid var(--gold);border-radius:.6rem;padding:.7rem .8rem;font-size:1.05rem;line-height:1.4}
.expl small{display:block;margin-top:.4rem;color:var(--mut);font-size:.78rem}
.guardar{border:.15rem solid var(--gold);border-radius:.8rem;padding:.55rem .8rem;background:var(--card)}
.guardar span{display:block;color:var(--gold);font-size:.75rem;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.guardar b{font-size:1.3rem;line-height:1.25}
.sair{align-self:center;background:transparent;color:var(--mut);text-decoration:underline;font-size:.85rem;min-height:2.6rem;padding:.4rem .8rem}
h1,h2{font-family:var(--disp);color:var(--gold);margin:0;line-height:1.1;font-weight:400}
h1{font-size:1.9rem;text-shadow:0 0 1rem rgba(255,200,61,.5)}
h2{font-size:1.7rem}
.sub{color:var(--mut);margin:0}
.grande{font-size:4rem;line-height:1}
.painel{background:var(--card);border-radius:1rem;padding:.8rem .9rem;text-align:left;width:100%;display:flex;flex-direction:column;gap:.6rem}
.regras{margin:0;padding-left:1.2rem;color:var(--mut);line-height:1.35;font-size:.95rem}
.regras b{color:var(--ink)}
.campo{display:flex;flex-direction:column;gap:.25rem;font-weight:800;font-size:.9rem}
.campo select{font:inherit;min-height:3rem;padding:.5rem .6rem;border-radius:.7rem;border:.12rem solid #3a4890;background:#0f1842;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;width:100%}
.stats div{background:var(--card);border-radius:.8rem;padding:.5rem .2rem;text-align:center}
.stats b{display:block;font-family:var(--disp);font-size:1.6rem;color:var(--gold);font-weight:400}
.stats span{font-size:.75rem;color:var(--mut);font-weight:700}
.salmo{background:#0f1842;border:.12rem solid rgba(255,200,61,.45);border-radius:.9rem;padding:.7rem .9rem;margin:0;font-size:.95rem;line-height:1.4;text-align:left}
.salmo small{display:block;margin-top:.4rem;color:var(--gold);font-weight:800}
.rev{display:flex;flex-direction:column;gap:.5rem;width:100%;text-align:left}
.rev h3{margin:.3rem 0 0;font-size:1rem;color:var(--gold)}
.rev .it{background:var(--card);border-radius:.8rem;padding:.6rem .8rem;font-size:.95rem;line-height:1.35}
.rev .it small{display:block;color:var(--mut);font-size:.75rem;margin-bottom:.2rem}
.rev .it b{color:var(--ok)}
.rev .it em{font-style:normal;color:var(--gold);font-weight:800}
.logo{display:block;aspect-ratio:520/449;margin:0 auto;opacity:.95;background-position:center;background-repeat:no-repeat;background-size:contain}
.carimbo{position:fixed;left:50%;top:40%;z-index:20;pointer-events:none;font-family:var(--disp);font-size:3.4rem;line-height:1;padding:.2rem 1rem;border:.3rem solid;border-radius:1rem;white-space:nowrap;background:rgba(11,18,48,.9);opacity:0;transform:translate(-50%,-50%) rotate(-8deg);animation:carimbo 1s ease-out forwards}
.c-certo{color:var(--ok)}.c-erro{color:var(--bad)}.c-tempo{color:var(--gold)}
@keyframes carimbo{0%{opacity:0;transform:translate(-50%,-50%) rotate(-8deg) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}78%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(1)}100%{opacity:0;transform:translate(-50%,-62%) rotate(-8deg) scale(1)}}
.confete{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.confete i{position:absolute;top:-2rem;width:.6rem;height:1rem;opacity:0;animation:cai 3s ease-in forwards}
@keyframes cai{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(105vh) rotate(720deg)}}
@media (min-width:700px){.app{border-left:.12rem solid rgba(255,200,61,.2);border-right:.12rem solid rgba(255,200,61,.2);background:rgba(11,18,48,.4)}}
@media (max-height:600px){.pergunta{font-size:1.15rem}.grande{font-size:2.6rem}.hud{padding-top:.4rem}.pc small{display:none}}

<script>// Parte 1: Aulas 1 a 7. Fonte: exercícios de fixação, textos e conclusões do Guia do Professor.
// mc: o[0] é a certa (o jogo embaralha). vf: v = true/false. e = por quê. m = para guardar.
window.PERGUNTAS = [
// AULA 1
{a:1,t:"mc",q:"Segundo a Aula 1, onde a guerra espiritual se decide?",o:["Na cabeça, no sentimento e na escolha","Em lugares e objetos de poder","Em palavras certas e fórmulas","Longe de nós, no mundo dos espíritos"],e:"Paulo fala de argumentos, pretensões e pensamentos: tudo isso acontece dentro da pessoa. Por isso o curso pede que você olhe para dentro antes de olhar para fora.",m:"A guerra se decide dentro: na cabeça, no sentimento e na escolha.",f:"2 Co 10.4-5; Pv 4.23"},
{a:1,t:"mc",q:"Na Aula 1, o inimigo é comparado a um marinheiro. O que ele faz?",o:["Navega a favor do vento: usa a inclinação que já existe em você","Briga contra o vento até vencer","Espera o mar ficar calmo","Cria um vento novo dentro de você"],e:"A tentação se apoia numa vontade que já estava ali. Ela não coloca uma vontade nova em você. Cada pessoa tem o seu vento.",m:"Saber qual é o seu vento já é meio caminho para não ser levado por ele.",f:"Tg 1.14"},
{a:1,t:"vf",q:"Para tentar alguém, o inimigo precisa criar nela um desejo que ela nunca teve.",v:false,e:"A tentação usa o desejo que já é seu: o desejo atrai, seduz, e só depois nasce o pecado.",m:"A tentação usa o que já está em você.",f:"Tg 1.14-15"},
{a:1,t:"mc",q:"Em 2 Coríntios 2, um homem pecou, se arrependeu e foi disciplinado. Que artimanha Paulo temia agora?",o:["A igreja ser dura demais com quem já se arrependeu","Um falso mestre chegar à igreja","A igreja se dividir por dinheiro","O homem voltar ao pecado"],e:"Paulo pede que a igreja perdoe, console e reafirme o amor, para que Satanás não leve vantagem. Ninguém ali pensava estar ajudando o inimigo: era gente sincera fazendo o que achava certo.",m:"O inimigo também vence por meio de gente sincera aplicando rigor no lugar errado.",f:"2 Co 2.5-11"},
{a:1,t:"vf",q:"O inimigo é criatura: tem limite, não sabe tudo e não está em todo lugar.",v:true,e:"Ele é real e habilidoso, mas não é Deus. Por isso a guerra não é medo: a vitória de Cristo já aconteceu.",m:"Inimigo real, mas criatura, com limite.",f:"Aula 1, seção 4; Cl 2.15"},
// AULA 2
{a:2,t:"mc",q:"Para agir contra nós, o inimigo precisa de permissão. De quem?",o:["De Deus e nossa: uma dupla permissão","Só de Deus","Só nossa","De ninguém"],e:"O limite do que ele pode fazer foi posto por Deus (Jó 1.12). E Pedro cobra a responsabilidade de Ananias, e não do diabo (Atos 5.3).",m:"Ele acende o fogo, mas a lenha é nossa.",f:"Jó 1.12; At 5.3"},
{a:2,t:"mc",q:"Na armadura de Efésios 6, qual peça apaga as setas inflamadas?",o:["O escudo","O cinto","A couraça","O capacete"],e:"Cinto: verdade na boca e na vida. Couraça: protege o peito, a consciência. Capacete: protege a cabeça, o que penso sobre mim diante de Deus. Escudo: apaga as setas inflamadas.",m:"Escudo apaga as setas. A espada é a única peça de ataque.",f:"Ef 6.14-17"},
{a:2,t:"mc",q:"Qual é a única peça de ataque da armadura de Deus?",o:["A espada, que é a palavra de Deus","O escudo da fé","O capacete da salvação","O cinto da verdade"],e:"Contra um inimigo espiritual, só funcionam armas espirituais. As outras peças servem para ficar firme.",m:"Guerra espiritual se luta com armas espirituais.",f:"Ef 6.17"},
{a:2,t:"vf",q:"Força de vontade e boa decisão bastam para vencer a tentação.",v:false,e:"Força de vontade não é arma espiritual. A armadura é “de Deus”: você não fabrica as peças, recebe e veste.",m:"A armadura não é sua: você recebe e veste.",f:"Ef 6.11"},
{a:2,t:"mc",q:"Em Tiago 4.7, o que vem antes de “Resistam ao Diabo”?",o:["“Submetam-se a Deus”","“Vigiem e orem”","“Aproximem-se de Deus”","“Vistam toda a armadura”"],e:"O inimigo foge por causa da submissão a Deus, e não por causa de uma técnica usada contra ele.",m:"Primeiro submeter-se a Deus. Depois resistir.",f:"Tg 4.7"},
// AULA 3
{a:3,t:"mc",q:"O que a tentação costuma mostrar, e o que ela esconde?",o:["Mostra o proveito e o prazer, esconde a conta que vem depois","Mostra o castigo, esconde o perdão","Mostra a igreja, esconde Deus","Mostra o pecado dos outros, esconde o nosso"],e:"Chama-se mostrar a isca e esconder o anzol. A serpente disse “certamente não morrerão” (Gn 3.4): era a isca, e o anzol vinha escondido atrás.",m:"A tentação mostra a isca e esconde o anzol.",f:"Gn 3.4"},
{a:3,t:"vf",q:"Ceder num pecado pequeno normalmente prepara o caminho para um maior.",v:true,e:"É o fermento: um pouco faz toda a massa ficar fermentada. Os pecados pequenos passam despercebidos, e é isso que os torna perigosos.",m:"Não existe quantidade segura de fermento.",f:"1 Co 5.6"},
{a:3,t:"vf",q:"Quanto menor a tentação para pecar, menos grave é o pecado.",v:false,e:"É o contrário: quanto menos custou para me comprar, pior o que isso diz de mim. Esaú vendeu o que tinha por um prato de comida.",m:"Tentação pequena não faz pecado pequeno.",f:"Aula 3, seção 7"},
{a:3,t:"mc",q:"José e Davi enfrentaram tentações parecidas. O que José fez que Davi não fez?",o:["Saiu do lugar","Orou antes","Consultou um sacerdote","Contou ao rei"],e:"José saiu correndo (Gn 39.12). Davi ficou olhando (2 Sm 11.2). A diferença aconteceu antes do pecado, e não durante.",m:"Quem foge antes não precisa resistir depois.",f:"Gn 39.12; 2 Sm 11.2"},
{a:3,t:"mc",q:"“Bom negócio, esperteza” é o nome bonito de qual pecado?",o:["Ganância","Orgulho","Bebedeira","Língua que fere"],e:"O nome bonito disfarça. “É da idade” = impureza. “Cuidado com a imagem” = orgulho. “Eu sou sincero, falo o que penso” = língua que fere. “Boa camaradagem” = bebedeira.",m:"O nome muda, a coisa não.",f:"Is 5.20"},
{a:3,t:"mc",q:"Quantas trocas de nome Isaías 5.20 denuncia?",o:["Três","Duas","Quatro","Sete"],e:"Mal por bem, trevas por luz, amargo por doce. O remédio é chamar cada coisa pelo nome certo.",m:"Chame cada coisa pelo nome certo.",f:"Is 5.20"},
// AULA 4
{a:4,t:"mc",q:"Das três licenças, qual age depois do pecado, oferecendo uma saída barata?",o:["“Arrepender-se é fácil”","“Até gente boa caiu”","“Deus é só misericórdia”","“Todo mundo faz”"],e:"A primeira age antes do pecado (um exemplo), a segunda durante (um Deus que não se importa), a terceira depois (uma saída barata). Juntas cobrem o caminho inteiro.",m:"Antes, durante e depois: três licenças, e todas contam só metade.",f:"Aula 4, conclusão"},
{a:4,t:"mc",q:"Judas e Pedro sentiram peso depois de trair Jesus. Qual foi a diferença entre os dois?",o:["Só Pedro voltou e se deixou restaurar","Judas sentiu menos","Pedro nunca errou de novo","Judas não devolveu o dinheiro"],e:"A diferença não está no tamanho do sentimento, e sim no destino do caminho. Judas devolveu o dinheiro e foi embora. Pedro chorou e se deixou restaurar por Jesus.",m:"Arrependimento volta para Deus. Remorso é só peso.",f:"Mt 27.3-5; Lc 22.62; Jo 21.15-17"},
{a:4,t:"vf",q:"Arrepender-se é sentir remorso pelo que aconteceu.",v:false,e:"Isso é remorso: peso pelo que aconteceu, sem mudança de rumo. Arrependimento é dor pelo pecado que leva a mudar de caminho.",m:"Arrependimento muda o rumo.",f:"2 Co 7.10"},
{a:4,t:"mc",q:"Qual é a última linha de Êxodo 34.7, a que quase ninguém cita?",o:["“Contudo, não deixa de punir o culpado.”","“Eu sou o SENHOR, o seu Deus.”","“Perdoa a maldade para sempre.”","“Sua graça dura de geração em geração.”"],e:"Quem cita só a parte da misericórdia usa Deus como licença para pecar. A segunda metade da frase está lá, e é ela que desmancha a licença.",m:"Leia a frase inteira, até o fim.",f:"Êx 34.6-7"},
{a:4,t:"vf",q:"Como Deus é misericordioso, o pecado do crente não traz consequência nenhuma nesta vida.",v:false,e:"Davi foi perdoado e mesmo assim a espada não saiu da casa dele. Perdão não apaga toda consequência.",m:"Deus perdoa, mas a consequência pode ficar.",f:"Aula 4, seção 7"},
// AULA 5
{a:5,t:"mc",q:"No Salmos 73, o salmista invejava os ímpios. O que mudou quando ele entrou no santuário?",o:["O lugar de onde ele olhava: viu o destino dos ímpios","A situação financeira dele","Os ímpios deixaram de prosperar","Ele recebeu uma explicação nova sobre a vida dos outros"],e:"Ele não recebeu explicação nova. Mudou de lugar e, do lugar certo, viu o desfecho que faltava na conta.",m:"A conta só fecha quando se vê o desfecho. Entre no santuário.",f:"Sl 73.17"},
{a:5,t:"mc",q:"Quantas ordens seguidas Provérbios 4.14-15 dá sobre o caminho dos maus?",o:["Seis","Duas","Quatro","Dez"],e:"Não trilhe, não ande, evite, não passe, afaste-se, não pare junto. A ordem nunca é aguentar: é sair de perto.",m:"Diante do pecado, a ordem é afastar-se.",f:"Pv 4.14-15"},
{a:5,t:"mc",q:"Por que o fariseu de Lucas 18 voltou para casa sem ser justificado, se ele não mentiu?",o:["Usou a régua errada: comparou-se com o publicano","Mentiu em tudo o que disse","Não orou em voz alta","Não era do povo de Deus"],e:"O problema não foi mentira, e sim medida. Ele se comparou com o publicano em vez de se medir por Deus.",m:"Meça-se pela Palavra, e não pelo vizinho.",f:"Lc 18.9-14; 2 Co 10.12"},
{a:5,t:"vf",q:"A prosperidade de quem vive no erro é prova de que Deus aprova o caminho dele.",v:false,e:"Salmos 73 e Salmos 37.35-36 mostram o contrário: o ímpio parecia uma árvore frondosa, mas depois passou, e ele já não existia.",m:"Olhe o desfecho, e não o meio da história.",f:"Sl 73; Sl 37.35-36"},
{a:5,t:"mc",q:"“O Senhor ____ a quem ama.” Complete (Hebreus 12.6).",o:["disciplina","abandona","esquece","dispensa"],e:"O sofrimento de quem anda com Deus não é sinal de caminho errado. A correção de Deus ensina.",m:"A correção de Deus é ensino de quem ama.",f:"Hb 12.6"},
// AULA 6
{a:5,t:"mc",q:"Na Aula 5, qual imagem mostra que o problema não é a tentação, e sim o que carregamos dentro?",o:["Quem carrega pólvora precisa ficar longe das faíscas","O peixe que morde o anzol","O machado emprestado","O feixe de flechas"],e:"O problema nunca foi a faísca. É o que você carrega. Como você carrega isso o tempo todo, a distância deixa de ser fraqueza e passa a ser bom senso.",m:"Quem carrega pólvora fica longe das faíscas.",f:"Aula 5, seção 1.2"},
{a:6,t:"vf",q:"Evitar a má companhia quer dizer que o cristão deve se afastar de todo descrente.",v:false,e:"1 Coríntios 5.9-10 diz o contrário. Jesus ia até as pessoas sem tomá-las como referência. O aviso mais duro é sobre quem “se diz irmão”.",m:"Ir até as pessoas é missão. Moldar-se por elas é perigo.",f:"1 Co 5.9-11; Mt 9.10-13"},
{a:6,t:"mc",q:"O que os bereanos faziam todos os dias?",o:["Examinavam as Escrituras para conferir o que ouviam","Jejuavam antes de ouvir Paulo","Expulsavam os falsos mestres","Liam só as cartas de Paulo"],e:"Eles ouviram um apóstolo e foram conferir. A proteção contra o erro é ter a verdade dentro, e não catalogar erros.",m:"Confira tudo na Escritura, como os bereanos.",f:"At 17.11"},
{a:6,t:"mc",q:"Em 1 Coríntios 15.33, o que corrompe os bons costumes?",o:["As más companhias","As más leituras","As más notícias","Os maus dias"],e:"O remédio contra a má companhia é escolher de quem se pega o jeito.",m:"Escolha de quem você pega o jeito.",f:"1 Co 15.33"},
// AULA 7
{a:7,t:"vf",q:"Para se afastar de Deus, é necessário cometer algum pecado grave.",v:false,e:"Basta parar de fazer o certo. Quase ninguém percebe o primeiro degrau, e é lá que quase tudo começa.",m:"O esfriamento começa no primeiro degrau, e quase ninguém percebe.",f:"Aula 7, seção 8"},
{a:7,t:"mc",q:"Na parábola do semeador, o que acontece com a semente entre os espinhos?",o:["É sufocada aos poucos","É arrancada","É comida pelas aves","Seca por falta de raiz"],e:"As preocupações, as riquezas e os deleites da vida apertam até tirar o ar, pouco a pouco.",m:"Esfriar é ser sufocado aos poucos, e não arrancado.",f:"Lc 8.14"},
{a:7,t:"mc",q:"Quais são os três verbos de Apocalipse 2.5 para quem esfriou, na ordem?",o:["Lembra-te, arrepende-te, volta à prática","Ora, jejua, serve","Vigia, resiste, permanece","Reconhece, confessa, descansa"],e:"É o caminho de volta: lembrar de onde caiu, arrepender-se e voltar a praticar as primeiras obras.",m:"Lembra-te. Arrepende-te. Volta.",f:"Ap 2.5"},
{a:7,t:"mc",q:"“Não deixemos de ____, como alguns têm feito por costume.” Complete (Hebreus 10.25).",o:["reunir-nos","orar","jejuar","cantar"],e:"Reunir-se com a igreja é um dos deveres que a artimanha do esfriamento procura afastar.",m:"Não deixemos de reunir-nos.",f:"Hb 10.25"},
{a:7,t:"vf",q:"Como Cristo já cumpriu tudo, os deveres cristãos deixaram de ser necessários.",v:false,e:"Somos salvos para as boas obras. A obra não é a causa da salvação, é o fruto dela.",m:"Somos salvos por graça, para boas obras.",f:"Ef 2.8-10; Fp 2.12-13"},
];
</script>
<script>// Parte 2: Aulas 8 a 14, mais o resumo de cada aula para a revisão final.
window.PERGUNTAS = window.PERGUNTAS.concat([
// AULA 8
{a:8,t:"vf",q:"O número de pessoas que segue um caminho mostra se ele é certo.",v:false,e:"Êxodo 23.2 manda não acompanhar a multidão para fazer o mal, e Jesus diz que o caminho estreito tem poucos. Ser minoria não é mérito: é só constatação.",m:"Ser minoria não é mérito. O que vale é o que a Palavra diz.",f:"Êx 23.2; Mt 7.13-14"},
{a:8,t:"mc",q:"Em Filipenses 3.8, Paulo chama de “refugo” o quê?",o:["O próprio currículo religioso","Os pecados do passado","Os bens materiais","Os amigos de antes"],e:"Ele não parou de fazer: continuou correndo (Fp 3.14). Parou de descansar naquilo como se fosse moeda diante de Deus.",m:"Continue fazendo, mas não descanse no que você faz.",f:"Fp 3.8,14"},
{a:8,t:"mc",q:"Hebreus 4.16 convida a chegar ao trono da graça com toda a quê?",o:["Confiança","Reverência","Perfeição","Pressa"],e:"Antes do convite, o versículo 15 diz que Jesus se compadece das nossas fraquezas. Por isso podemos chegar e falar, mesmo com a cabeça bagunçada.",m:"Chegue ao trono da graça com confiança.",f:"Hb 4.15-16"},
{a:8,t:"vf",q:"Pensamentos que fogem durante a oração mostram que a pessoa não deveria estar orando.",v:false,e:"É experiência comum. O problema não é a distração: é desistir de orar.",m:"Distrair-se é comum. Desistir é o problema.",f:"Aula 8, seção 7"},
// AULA 9
{a:9,t:"mc",q:"Em Zacarias 3 a acusação contra Josué era verdadeira. Como o acusador perdeu a causa?",o:["Quem respondeu foi o Senhor, que trocou as vestes sujas","Josué provou que estava limpo","Josué negou a sujeira","O acusador desistiu sozinho"],e:"A causa não foi ganha negando a sujeira. Foi ganha porque a defesa veio de fora do réu: Deus tirou as vestes sujas e vestiu outras.",m:"Quem responde por você não é você.",f:"Zc 3; Rm 8.33"},
{a:9,t:"mc",q:"Qual é a diferença entre a convicção que vem de Deus e a acusação do adversário?",o:["A convicção aponta um pecado específico para tratar. A acusação condena a pessoa inteira","A convicção é mais forte que a acusação","A acusação só vem à noite","Não há diferença"],e:"Convicção: “isto aqui você precisa acertar”. Acusação: “você é assim, sempre foi, sempre vai ser”. Uma expõe para curar, a outra para condenar.",m:"Convicção cura. Acusação condena.",f:"Rm 8.1"},
{a:9,t:"vf",q:"Quem tem fé verdadeira necessariamente tem certeza plena e constante da salvação.",v:false,e:"Fé e certeza não são a mesma coisa. Dúvida é não ter certeza, o que não é o mesmo que não ter fé.",m:"Dúvida não é o mesmo que falta de fé.",f:"1 Jo 5.13"},
{a:9,t:"mc",q:"Em Marcos 9.24, o que o pai do menino disse a Jesus?",o:["“Eu creio, ajuda-me a vencer a minha incredulidade!”","“Eu creio, e isso me basta!”","“Senhor, aumenta a minha fé!”","“Não sou digno de que entres em minha casa.”"],e:"As duas metades da frase cabem no mesmo coração: ele crê e pede ajuda para a sua incredulidade.",m:"Pode-se crer e duvidar. Peça ajuda.",f:"Mc 9.24"},
// AULA 10
{a:10,t:"mc",q:"Na Aula 10, qual imagem explica a perda do sentimento na vida cristã?",o:["A bolsa de prata sumiu, mas não a caixa de joias","O vento que mudou","A porta que se fechou","O machado que caiu no rio"],e:"Perder a alegria de antes não prova que a fé nunca foi verdadeira. Davi pede de volta a alegria da salvação, e não a salvação.",m:"Sem sentimento não é o mesmo que sem fé.",f:"Sl 51.12"},
{a:10,t:"mc",q:"Na Aula 10, qual imagem explica por que alguns são muito tentados?",o:["O pirata não aborda navio vazio","O lobo à porta do aprisco","O ladrão no campo vazio","O caçador sem armadilha"],e:"Ser muito tentado não é sinal de que Deus retirou o seu amor. Tentação intensa indica que existe carga a bordo.",m:"Muita tentação não é sinal de abandono.",f:"Lc 22.31; 2 Co 12.7; Hb 4.15"},
{a:10,t:"mc",q:"Jesus sabia que Pedro seria peneirado. O que ele pediu em Lucas 22.32?",o:["Que a fé dele não desfalecesse","Que a peneira fosse embora","Que ele nunca negasse","Que ele fugisse da prova"],e:"Jesus não pediu que a prova não viesse. Pediu que a fé não desfalecesse, e ainda avisou: depois, fortaleça os seus irmãos.",m:"Peça para atravessar, e não apenas para escapar.",f:"Lc 22.31-32"},
{a:10,t:"vf",q:"Sentir uma luta interior constante é prova de que a pessoa não é convertida.",v:false,e:"Carne e Espírito se opõem um ao outro dentro do crente. A luta prova que há duas forças, e não uma.",m:"Luta interior não é sentença.",f:"Gl 5.17"},
// AULA 11
{a:11,t:"mc",q:"Na Aula 11, qual imagem mostra que cargo e capacidade foram recebidos, e não produzidos por nós?",o:["O machado emprestado","A lupa e o espelho","O feixe de flechas","A isca e o anzol"],e:"O rapaz gritou “era emprestado!” porque perdeu o que era de outro. Paulo pergunta: “o que você tem que não tenha recebido?”",m:"Nada é seu: tudo foi recebido.",f:"2 Rs 6.5; 1 Co 4.7"},
{a:11,t:"mc",q:"Na imagem do feixe de flechas, o que acontece quando o laço é cortado?",o:["Cada flecha quebra sozinha, sem esforço","Nenhuma flecha quebra","O feixe vira um arco","Os filhos o quebram juntos"],e:"Enquanto estiverem unidos, serão invencíveis. Quando o laço se romper, serão quebrados com facilidade.",m:"Unidos somos fortes. Sem o laço, somos quebrados.",f:"Ef 4.2-3"},
{a:11,t:"mc",q:"Na imagem da lupa e do espelho, para que usamos a lupa?",o:["Para ver os defeitos dos outros","Para ver as nossas virtudes","Para ler a Bíblia","Para examinar os frutos"],e:"Temos muitos olhos para as fraquezas uns dos outros e nenhum para as graças. Deus não faz assim: olhou a retidão de Davi e a perseverança de Jó.",m:"Veja também as graças dos irmãos, e não só os defeitos.",f:"Tg 5.11"},
{a:11,t:"vf",q:"Quem estudou pouco não tem como crescer no conhecimento de Deus.",v:false,e:"Os discípulos eram vistos como homens comuns e sem instrução, e se reconheceu que tinham estado com Jesus. Em Oseias 4.6 o verbo é “rejeitaste”.",m:"O problema é rejeitar o conhecimento, e não ter estudado pouco.",f:"At 4.13; Os 4.6"},
// AULA 12
{a:12,t:"mc",q:"Na parábola de Lucas 15.20, quem viu o outro primeiro, e quem correu?",o:["O pai viu o filho de longe e correu","O filho viu o pai e correu","O irmão mais velho correu","O servo correu"],e:"O pai viu de longe, correu, abraçou e beijou antes da primeira palavra do pedido de desculpas.",m:"Quem corre é o pai.",f:"Lc 15.20"},
{a:12,t:"mc",q:"Qual imagem da Aula 12, ligada a Apocalipse 3.20, responde às cinco frases que impedem alguém de vir a Cristo?",o:["A porta com a maçaneta por dentro","A chave perdida","A ponte quebrada","O muro alto"],e:"Cristo está à porta e bate. Quem ouve e abre, ele entra. A porta não está trancada contra ninguém.",m:"A porta está aberta.",f:"Ap 3.20"},
{a:12,t:"mc",q:"O que Mateus estava fazendo quando Jesus o chamou?",o:["Estava sentado na coletoria, trabalhando","Estava pescando","Estava orando no templo","Estava em cima de uma árvore"],e:"Mateus foi chamado na coletoria, Zaqueu na árvore, Lídia na beira do rio. Nenhum estava preparado.",m:"Ninguém estava preparado quando foi chamado.",f:"Mt 9.9; Lc 19.5; At 16.14"},
{a:12,t:"vf",q:"A Bíblia exige que a pessoa esteja digna antes de crer em Cristo.",v:false,e:"Cristo Jesus veio ao mundo para salvar pecadores. Ninguém é digno, e é por isso que a porta é de graça.",m:"Ninguém é digno. A porta é de graça.",f:"1 Tm 1.15; Rm 5.8; Ef 2.8-9"},
// AULA 13
{a:13,t:"mc",q:"Como o caixa de banco aprende a reconhecer a nota falsa?",o:["Estudando a nota verdadeira","Estudando todas as notas falsas","Desconfiando de todas as notas","Perguntando ao cliente"],e:"Quem estuda só o erro fica bom em desconfiar de tudo. Quem conhece bem a Escritura reconhece o falso sem precisar caçá-lo.",m:"Conheça bem a verdade e você reconhece o falso.",f:"At 17.11"},
{a:13,t:"mc",q:"Segundo Mateus 7.16, como se conhecem os falsos profetas?",o:["Pelos seus frutos","Pelas suas roupas","Pelo número de seguidores","Pela eloquência"],e:"Jesus não mandou ignorar o assunto nem sair caçando. Mandou ficar atento e deu o critério: o fruto.",m:"Pelos frutos os conhecereis.",f:"Mt 7.15-16"},
{a:13,t:"mc",q:"Segundo 1 Timóteo 5.19, uma acusação contra um presbítero só deve ser aceita com quê?",o:["Duas ou três testemunhas","A palavra de um diácono","A decisão da maioria","Uma carta do pastor"],e:"O mesmo capítulo que manda honrar quem ensina bem protege o obreiro de acusação leviana.",m:"Honra a quem ensina bem. Acusação só com testemunhas.",f:"1 Tm 5.17-19"},
{a:13,t:"vf",q:"A Bíblia condena que quem ensina receba sustento pelo seu trabalho.",v:false,e:"Os presbíteros que lideram bem merecem dupla honra, especialmente os que se dedicam à pregação e ao ensino.",m:"Quem ensina bem merece dupla honra.",f:"1 Tm 5.17-18"},
// AULA 14
{a:14,t:"mc",q:"Segundo Tiago 4.7, o que acontece quando resistimos ao diabo?",o:["Ele foge de vocês","Ele ataca mais","Ele fica quieto","Ele muda de disfarce"],e:"Antes de “resistam” vem “submetam-se a Deus”. Resistir é segurar a posição, e não discutir com a tentação.",m:"Submeta-se a Deus, resista, e ele foge.",f:"Tg 4.7"},
{a:14,t:"mc",q:"Segundo João 15.5, sem Jesus o que podemos fazer?",o:["Coisa alguma","Pouca coisa","Quase tudo","Só o básico"],e:"Pedro se apoiou numa promessa antiga e caiu naquela mesma noite. Graça de ontem não enfrenta a tentação de hoje.",m:"Sem Jesus, coisa alguma.",f:"Jo 15.5"},
{a:14,t:"mc",q:"As dez regras finais tratam de quê?",o:["De andar perto de Deus","De estudar o inimigo","De enfrentar o inimigo","De decorar as artimanhas"],e:"Nenhuma delas é sobre o inimigo. Palavra, Espírito, sabedoria, resistência, plenitude, humildade, vigilância, comunhão, dependência e oração: todas são sobre a sua relação com Deus.",m:"Dez regras, uma só ideia: andar perto de Deus.",f:"Aula 14, seção 5"},
{a:14,t:"mc",q:"O que Sansão não sabia em Juízes 16.20?",o:["Que o SENHOR o tinha deixado","Que Dalila o traía","Que cortaram o seu cabelo","Que os filisteus vinham"],e:"Ele não perdeu a força de repente. Perdeu antes, e só descobriu na hora de usá-la. Por isso as dez regras são hábitos, e não emergências.",m:"Mantenha a comunhão com Deus todos os dias.",f:"Jz 16.20"},

  } else {
    var p = ARM[Math.min(G.perdidas, 5)]; G.perdidas++; G.lastLoss = G.perdidas - 1;
    G.msg = (porTempo ? "Acabou o tempo! " : "Errou. ") + "Perdemos o " + p.n.toLowerCase() + " " + p.d + ".";
    G.errosNivel.push(q);
    if (!G.errosTodos.some(function(e){ return e.q === q.q; })) G.errosTodos.push(q);
  }
  render();
  if (ok){ carimbo("CERTO!","certo"); confete(24); som("certo"); vibra(40); var hs = document.querySelectorAll(".hp i"); if (hs[G.hp]) hs[G.hp].classList.add("hit"); }
  else { carimbo(porTempo ? "TEMPO!" : "ERROU!", porTempo ? "tempo" : "erro"); som(porTempo ? "gongo" : "erro"); vibra([80,40,80]); }
}
function proxima(){
  if (G.hp <= 0){
    if (G.nivel >= NIVEIS.length - 1){ G.tela = "fim"; render(); confete(80); som("vitoria"); vibra([100,50,100,50,200]); }
    else { G.tela = "limpo"; render(); confete(60); som("vitoria"); vibra([100,50,200]); }
    return;
  }
  if (G.perdidas >= ARM.length){ G.tela = "derrota"; render(); som("derrota"); return; }
  G.i++; novaPergunta();
}

/* ---------- telas ---------- */
function hudHTML(){
  var N = NIVEIS[G.nivel], hp = "", ar = "";
  for (var k=0;k<HP;k++) hp += "<i class='"+(k < G.hp ? "" : "off")+"'></i>";
  ARM.forEach(function(p,k){ ar += "<div class='pc"+(k < G.perdidas ? " off" : "")+(G.fase==="res" && G.lastLoss===k ? " quebra" : "")+"' title='"+p.n+" "+p.d+"'><span aria-hidden='true'>"+p.i+"</span></div>"; });
  return "<div class='hud'><div class='hud1'><span class='ico' aria-hidden='true'>"+N.ico+"</span><div class='nivel'>Nível "+(G.nivel+1)+" de 3 · "+N.nome+"<div class='hp' role='img' aria-label='Força do inimigo: "+G.hp+" de "+HP+"'>"+hp+"</div></div>"+somBtn()+"<button class='somb' id='sair' aria-label='Encerrar jogo'>✕</button></div>"+
    "<div class='armadura' role='img' aria-label='Armadura: "+(ARM.length-G.perdidas)+" de "+ARM.length+" peças'>"+ar+"</div></div>";
}
function somBtn(){ return "<button class='somb' id='som' aria-pressed='"+somOn+"' aria-label='"+(somOn?"Som ligado. Tocar para desligar":"Som desligado. Tocar para ligar")+"'>"+(somOn?"🔊":"🔇")+"</button>"; }

function render(){
  salva();
  var t = G.tela, h = "", app = $("app");
  if (t === "setup") h = telaSetup();
  else if (t === "nivel") h = telaNivel();
  else if (t === "jogo") h = telaJogo();
  else if (t === "limpo") h = telaLimpo();
  else if (t === "derrota") h = telaDerrota();
  else if (t === "fim") h = telaFim();
  app.innerHTML = h; ligar(); fit(); if (t === "setup") instHTML();
  var c = app.querySelector(".corpo"); if (c) c.scrollTop = 0;
}

function telaSetup(){
  return "<div class='corpo c'><span class='logo' role='img' aria-label='Igreja do Evangelho Quadrangular Templo Gospel'></span>"+
   "<h1>Batalha em Equipe</h1><p class='sub'>Guerras Espirituais · todos juntos contra o inimigo</p><div id='inst' style='width:100%'></div>"+(pend?"<div class='dica'><b>Partida em andamento</b><br>Nível "+(pend.nivel+1)+" de 3. Quer continuar de onde parou?<br><button class='btn' id='cont' style='margin-top:.5rem'>▶ Continuar a batalha</button></div>":"")+
   "<div class='painel'><ol class='regras'>"+
   "<li><b>Passem o celular</b> e discutam: o grupo escolhe a resposta junto.</li>"+
   "<li>Acertou: o inimigo perde força. Errou: <b>cai uma peça da armadura</b> (Efésios 6).</li>"+
   "<li>Derrotem <b>3 inimigos</b>. Se as 6 peças caírem, o nível recomeça.</li>"+
   "<li>Ajudas sem limite: <b>pista</b>, <b>tirar 2 alternativas</b> e <b>1 minuto na apostila</b>.</li></ol>"+
   "<div class='duas'><label class='campo'>Tempo por pergunta<select id='tp'><option value='45'"+(G.tempo===45?" selected":"")+">45 segundos</option><option value='0'"+(G.tempo===0?" selected":"")+">Sem cronômetro</option></select></label>"+
   "<label class='campo'>Som<select id='sm'><option value='1'"+(somOn?" selected":"")+">Ligado</option><option value='0'"+(somOn?"":" selected")+">Desligado</option></select></label></div></div></div>"+
   "<div class='barra'><button class='btn' id='go'>Começar a batalha</button></div>";
}
function telaNivel(){
  var N = NIVEIS[G.nivel], rep = G.tentativas[G.nivel] > 0;
  return "<div class='corpo c'><p class='sub'>Nível "+(G.nivel+1)+" de 3 · Aulas "+N.de+" a "+N.ate+"</p><div class='grande' aria-hidden='true'>"+N.ico+"</div><h2>"+N.nome+"</h2>"+
   "<div class='painel'><ol class='regras'><li>Acertem <b>"+HP+" perguntas</b> para derrubar o inimigo.</li><li>A armadura está <b>completa</b>: 6 peças. Cada erro quebra uma.</li><li>Conversem e toquem em <b>Confirmar</b> só quando o grupo concordar.</li></ol></div></div>"+
   "<div class='barra'><button class='btn' id='comeca'>"+(rep?"Tentar de novo":"Entrar na batalha")+"</button></div>";
}
function telaJogo(){
  var q = G.lista[G.i], res = G.fase === "res", vf = q.t === "vf", corpo = "", barra = "";
  var final = G.hp === 1 && !res;
  var selo = "<div class='linha'><span class='selo'>Aula "+q.a+" · "+AULAS[q.a]+"</span>"+(final?"<span class='selo final'>Golpe final!</span>":"")+"</div>";
  var segHTML = (!res && G.tempo) ? "<span class='seg' id='seg' aria-hidden='true'>"+Math.ceil(Math.max(0,G.restante)/1000)+"</span>" : "";
  selo = "<div class='topo'>"+selo+segHTML+"</div>";
  if (!res){
    var tempo = G.tempo ? "<div class='barrat' aria-hidden='true'><i id='barrat' style='transform:scaleX("+Math.max(0,G.restante/(G.tempo*1000))+")'></i></div>" : "";
    var ops = "";
    q.o.forEach(function(tx,k){ ops += "<button role='radio' aria-checked='"+(G.sel===k)+"' class='opcao"+(G.sel===k?" sel":"")+(G.elim.indexOf(k)>=0?" elim":"")+"' data-k='"+k+"'"+(G.elim.indexOf(k)>=0?" disabled":"")+"><span class='l'>"+(vf?"":"ABCD".charAt(k))+"</span><span>"+esc(tx)+"</span></button>"; });
    var dica = "";
    if (G.apRest > 0) dica = "<div class='dica'><b>📖 Procurem na apostila</b><br>Aula "+q.a+" · "+esc(AULAS[q.a])+(q.f?" · "+esc(q.f):"")+"<div class='ap'><span id='apseg'>"+Math.ceil(G.apRest/1000)+"</span> s</div><button class='sair' id='apstop'>Já encontramos</button></div>";
    else if (G.pista) dica = "<div class='dica'><b>💡 Pista · Aula "+q.a+"</b><br>"+esc(q.p||RES[q.a]||"")+"</div>";
    var ajudas = "<div class='ajudas'><button class='aj' id='ajp'><b aria-hidden='true'>💡</b>Pista</button><button class='aj' id='aje'"+(vf||G.elim.length?" disabled":"")+"><b aria-hidden='true'>✂️</b>Tirar 2</button><button class='aj' id='aja'><b aria-hidden='true'>📖</b>Apostila 1 min</button></div>";
    corpo = selo+tempo+"<p class='pergunta'>"+esc(q.q)+"</p>"+dica+"<div class='opcoes' role='radiogroup' aria-label='Alternativas'>"+ops+"</div>"+ajudas+"";
    barra = "<button class='btn' id='conf'"+(G.sel==null?" disabled":"")+">Confirmar resposta</button>";
  } else {
    var resp = vf ? (q.c === 0 ? "Verdadeiro" : "Falso") : q.o[q.c];
    corpo = selo+"<p class='pergunta'>"+esc(q.q)+"</p><div class='aviso "+(G.acertou?"ok":"erro")+"'>"+esc(G.msg)+"</div>"+
      "<div class='resp'><span>Resposta</span><b>"+esc(resp)+"</b></div><div class='expl'>"+esc(q.e)+"<small>Aula "+q.a+" · "+AULAS[q.a]+(q.f?" · "+esc(q.f):"")+"</small></div>"+
      (q.m ? "<div class='guardar'><span>Para guardar (leiam juntos)</span><b>"+esc(q.m)+"</b></div>" : "");
    barra = "<button class='btn' id='prox'>"+(G.hp<=0?(G.nivel>=NIVEIS.length-1?"Ver a vitória":"Inimigo derrotado!"):G.perdidas>=ARM.length?"Ver o que revisar":"Próxima pergunta")+"</button>";
  }
  return hudHTML()+"<div class='corpo"+(res?" rv":"")+"'>"+corpo+"</div><div class='barra'>"+barra+"</div>";
}
function listaPG(arr){
  return arr.map(function(q){ return "<div class='it'><small>Aula "+q.a+" · "+esc(AULAS[q.a])+"</small>"+esc(q.q)+"<br><b>"+esc(q.t==="vf"?(q.c===0?"Verdadeiro":"Falso"):q.o[q.c])+"</b>"+(q.m?"<br><em>"+esc(q.m)+"</em>":"")+"</div>"; }).join("");
}
function telaLimpo(){
  var N = NIVEIS[G.nivel];
  return "<div class='corpo c'><div class='grande' aria-hidden='true'>🎉</div><h2>"+N.nome+" derrotado!</h2><p class='sub'>A armadura volta completa para o próximo nível.</p>"+
   "<div class='rev'><h3>Para guardar deste nível</h3>"+listaPG(G.certasNivel.concat(G.errosNivel.filter(function(q){ return G.certasNivel.indexOf(q) < 0; })))+"</div></div>"+
   "<div class='barra'><button class='btn' id='segue'>Próximo inimigo</button></div>";
}
function telaDerrota(){
  return "<div class='corpo c'><div class='grande' aria-hidden='true'>🛡️</div><h2>A armadura caiu</h2><p class='sub'>Sem pressa: leiam o que errou e tentem de novo, com perguntas novas.</p>"+
   "<div class='rev'><h3>Para revisar agora</h3>"+listaPG(G.errosNivel)+"</div></div>"+
   "<div class='barra'><button class='btn' id='refaz'>Recomeçar o nível</button><button class='sair' id='sair2'>Voltar ao início</button></div>";
}
function telaFim(){
  var resumo = "";
  for (var a=1;a<=14;a++) if (RES[a]) resumo += "<div class='it'><small>Aula "+a+"</small><b style='color:var(--ink)'>"+esc(AULAS[a])+"</b><br>"+esc(RES[a])+"</div>";
  var erros = G.errosTodos.length ? "<h3>Perguntas para revisar ("+G.errosTodos.length+")</h3>"+listaPG(G.errosTodos) : "<h3>Nenhum erro: armadura inteira!</h3>";
  return "<div class='corpo c'><div class='grande' aria-hidden='true'>🏆</div><h2>Vitória!</h2><p class='sub'>Os 3 inimigos caíram. Firmes na armadura de Deus.</p>"+
   "<div class='stats'><div><b>"+G.acertos+"</b><span>acertos</span></div><div><b>"+G.errosTodos.length+"</b><span>para revisar</span></div><div><b>"+(G.tentativas[0]+G.tentativas[1]+G.tentativas[2])+"</b><span>tentativas</span></div></div>"+
   "<p class='salmo'>“Bendito seja o SENHOR, que não nos entregou como presa aos seus dentes! Como um pássaro escapamos da armadilha do caçador; a armadilha foi quebrada, e nós escapamos. O nosso socorro está no nome do SENHOR, que fez os céus e a terra.”<small>Salmos 124.6-8 · leiam em pé, todos juntos</small></p>"+
   "<div class='rev'>"+erros+"<h3>Revisão das aulas</h3>"+resumo+"</div></div>"+
   "<div class='barra'><button class='btn' id='de-novo'>Jogar de novo</button></div>";
}

/* ---------- ajuste à altura da tela (respeita o tamanho de texto do sistema) ---------- */
var USER_PX = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16, SC = USER_PX / 16;
function fit(){
  var root = document.documentElement;
  var px = Math.min(21*SC, Math.max(13*SC, Math.min(window.innerWidth*0.047, window.innerHeight*0.026)*SC));
  root.style.fontSize = px + "px";
  if (!G || G.tela !== "jogo") return;
  var c = document.querySelector(".corpo"); if (!c) return;
  var n = 0;
  while (c.scrollHeight > c.clientHeight + 1 && px > 11.5*SC && n < 20){ px *= 0.96; root.style.fontSize = px + "px"; n++; }
}
window.addEventListener("resize", function(){ if (G) fit(); });

/* ---------- instalar como app (PWA) ---------- */
var instEv = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); instEv = e; if ($("inst")) instHTML(); });
function standalone(){ try { return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch(e){ return false; } }
function instHTML(){
  var x = $("inst"); if (!x) return;
  if (standalone() || location.protocol.indexOf("http") !== 0){ x.innerHTML = ""; return; }
  var ua = navigator.userAgent, ios = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (instEv){ x.innerHTML = "<button class='btn' id='instb'>📲 Instalar o app no celular</button>"; $("instb").onclick = function(){ instEv.prompt(); instEv = null; x.innerHTML = ""; }; }
  else if (ios){ x.innerHTML = "<div class='dica'><b>📲 Instalar no iPhone</b><br>No Safari, toque em <b>Compartilhar</b> (quadrado com seta) e depois em <b>Adicionar à Tela de Início</b>.</div>"; }
  else { x.innerHTML = "<div class='dica'><b>📲 Instalar como app</b><br>No Chrome, abra o menu <b>⋮</b> e toque em <b>Instalar app</b> (ou <b>Adicionar à tela inicial</b>).</div>"; }
}

/* ---------- ligações ---------- */
function ligar(){
  var s;
  if ((s = $("som"))) s.onclick = function(){ var sb = $("som"); somOn = !somOn; try { localStorage.setItem(CHAVE_SOM, somOn?"1":"0"); } catch(e){} sb.textContent = somOn?"🔊":"🔇"; sb.setAttribute("aria-pressed", ""+somOn); sb.setAttribute("aria-label", somOn?"Som ligado. Tocar para desligar":"Som desligado. Tocar para ligar"); if (somOn) som("clique"); };
  if ((s = $("cont"))) s.onclick = function(){ G = pend; pend = null; G.apRest = 0; som("clique"); render(); if (G.tela === "jogo" && G.fase === "q") iniciaTempo(); };
  if ((s = $("go"))) s.onclick = function(){ somOn = $("sm").value === "1"; try { localStorage.setItem(CHAVE_SOM, somOn?"1":"0"); } catch(e){} var tp = +$("tp").value; G = novo(tp); G.nivel = 0; pend = null; som("clique"); abreNivel(); };
  if ((s = $("comeca"))) s.onclick = function(){ som("clique"); comecaNivel(); };
  if ((s = $("segue"))) s.onclick = function(){ G.nivel++; abreNivel(); };
  if ((s = $("refaz"))) s.onclick = function(){ comecaNivel(); };
  if ((s = $("de-novo"))) s.onclick = reinicia;
  if ((s = $("sair2"))) s.onclick = reinicia;
  document.querySelectorAll(".opcao").forEach(function(b){ b.onclick = function(){ selecionar(+b.dataset.k); }; });
  if ((s = $("conf"))) s.onclick = function(){ confirma(false); };
  if ((s = $("prox"))) s.onclick = proxima;
  if ((s = $("ajp"))) s.onclick = function(){ G.pista = true; render(); };
  if ((s = $("aje"))) s.onclick = eliminar;
  if ((s = $("aja"))) s.onclick = iniciaAp;
  if ((s = $("apstop"))) s.onclick = paraApManual;
  if ((s = $("sair"))) s.onclick = function(){
    var sr = $("sair"); if (!sr) return;
    if (sr.dataset.c !== "1"){ sr.dataset.c = "1"; sr.textContent = "Sair?"; setTimeout(function(){ var x = $("sair"); if (x){ x.dataset.c = ""; x.textContent = "✕"; } }, 3000); return; }
    reinicia(); };
}
function reinicia(){ paraTempo(); pararAp(); var tp = G ? G.tempo : 45; G = novo(tp); render(); }

/* ---------- início ---------- */
var guardado = null, pend = null;
try { guardado = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (guardado && (!guardado.t || Date.now() - guardado.t > 6*3600*1000)) guardado = null; } catch(e){}
if (guardado && guardado.tela === "jogo" && guardado.lista){ pend = guardado; G = novo(guardado.tempo === 0 ? 0 : 45); render(); }
else { G = novo(45); render(); }
})();
</script>
